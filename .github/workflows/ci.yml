
name: Aayush Java CI Pipeline

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build project
        run: mvn clean compile

      - name: Run unit tests
        run: mvn test -Dtest=SearchServiceTest

      - name: Run integration tests
        run: mvn test -Dtest=SearchIntegrationTest
